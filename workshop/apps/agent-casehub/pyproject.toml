[project]
name = "agent-casehub"
version = "1.0.0"
description = "CaseHub - Saldo support case desk, exposed as a Databricks custom agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "databricks-sdk>=0.30.0",
    # AgentServer and the ResponsesAgent types. /responses and /agent/info are
    # recent additions, so this floor is not decorative.
    "mlflow>=3.12.0",
    "openai>=1.60.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[project.scripts]
casehub-server = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "PL", "I", "FAST", "ASYNC", "TC", "RUF", "D"]
# D202 is disabled because docformatter inserts a blank line after a docstring that
# precedes a `with` block; with the rule on, the two tools would undo each other.
ignore = [
    "D105",
    "D107",
    "D200",
    "D202",
    "D203",
    "D205",
    "D212",
    "D401",
    "D413",
    "D417",
]

[tool.ruff.lint.per-file-ignores]
# The system prompt is prose addressed to a model. Wrapping it to 88 columns would
# change what the model reads, so the lines stay as they are written.
"src/app/agent/agent.py" = ["E501"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.docformatter]
recursive = true
in-place = true
pre-summary-newline = true
make-summary-multi-line = true
wrap-summaries = 88
wrap-descriptions = 88
