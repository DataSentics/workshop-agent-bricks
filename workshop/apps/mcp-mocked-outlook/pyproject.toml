[project]
name = "mocked-outlook-mcp-demo"
version = "1.0.0"
description = "Mocked Outlook MCP Server for Databricks demos"
requires-python = ">=3.11"
dependencies = [
    # Mailboxes live in a Unity Catalog volume, which is not mounted into an App
    # container, so every read and write goes through the SDK Files API.
    "databricks-sdk>=0.30.0",
    "fastapi>=0.115.0",
    "mcp>=1.9.0,<2.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
outlook-server = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "PL", "I", "FAST", "ASYNC", "TC", "RUF", "D"]
# D202 is disabled because docformatter inserts a blank line after a docstring that
# precedes a `with` block; with the rule on, the two tools would undo each other.
ignore = [
    "D105",
    "D107",
    "D200",
    "D202",
    "D203",
    "D205",
    "D212",
    "D401",
    "D413",
    "D417",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.docformatter]
recursive = true
in-place = true
pre-summary-newline = true
make-summary-multi-line = true
wrap-summaries = 88
wrap-descriptions = 88
